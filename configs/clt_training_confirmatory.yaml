# Confirmatory mask-aware TopK CLT configuration (P0-2).
# Split paths, hashes, model, seed and output directory are mandatory launcher
# overrides.  Seeds are independent single-GPU runs, not DDP replicas.

model:
  name: "protgpt2"
  inference_dtype: "bfloat16"
  inference_dtype_verification: "all_floating_model_parameters_exactly_declared_before_first_activation"

data:
  fasta_path: "/gpfs/jiaotongdamoxing/zhk_zip/data/uniref50/uniref50.fasta"
  manifest_path: null
  manifest_sha256: null
  split: "train"
  model_input_format: "sequence"
  max_seq_len: 256
  num_sequences: 300000

clt:
  d_clt: 8192
  k: 128
  window: 8
  resample_every: 2500
  dead_feature_threshold: 5000
  # Avoid reinitializing most of an overcomplete dictionary from one tiny
  # activation batch, which can duplicate residual directions and destabilize
  # Adam. Dead features are selected oldest-first and revisited over events.
  max_resample_fraction: 0.05

training:
  seed: 17
  gpu: 0
  batch_size: 2
  total_steps: 200000
  lr: 0.0003
  lr_warmup_steps: 3000
  grad_clip_norm: 1.0

checkpoint:
  save_dir: "/gpfs/jiaotongdamoxing/zhk_zip/biocc/npj_revision_20260717/dictionaries_topk_bf16_r2"
  save_every_steps: 5000
  keep_last: 2
  analysis_every_steps: 25000
  require_sha256_manifest: true
  required_path_prefix: "/gpfs/"

logging:
  wandb_project: null
  wandb_entity: null
  log_every_steps: 50
