# CLT Training Configuration
# ===========================
# Start with ProtGPT2 (738M, unconditional baseline) for validation,
# then scale to ZymCTRL, InstructProtein, ProGen2-xlarge.

# Protein generation model (frozen, inference only)
model:
  name: "protgpt2"                    # Key from MODEL_REGISTRY
  dtype: "float16"

# Data
data:
  fasta_path: "/Data/lzp/BioInterpretebility-CC/data/uniref50/uniref50.fasta"
  max_seq_len: 256                    # Shorter for faster iteration during dev
  num_sequences: 100000               # Subsample for initial training

# CLT architecture
clt:
  d_clt: 16384                        # ~12.8x expansion
  k: 64                               # TopK per token per layer
  window: 8                           # Decode window (each feature writes to next 8 layers)
  resample_every: 5000                # Dead feature resampling interval
  dead_feature_threshold: 10000       # Steps without firing before a feature is considered dead

# Training
training:
  seed: 0
  gpu: 0
  batch_size: 4                       # Sequences per step
  total_steps: 100000
  lr: 0.0003                          # 3e-4
  lr_warmup_steps: 2000
  grad_clip_norm: 1.0

# Checkpointing
checkpoint:
  save_dir: "/Data/lzp/BioInterpretebility-CC/r2_decoder_sparse_readout_audit/results/clt_weights/protgpt2"
  save_every_steps: 5000

# Logging
logging:
  wandb_project: "bio-interpretability-r2"
  wandb_entity: null
  log_every_steps: 50
