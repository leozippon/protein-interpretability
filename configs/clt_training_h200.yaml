# H200-friendly CLT training config
# =================================
# This config is intended for offline cluster execution:
# - model weights live on GPFS
# - code and outputs live on OSS mounts
# - wandb is disabled by default
#
# Use scripts/04_run_h200_clt.sh to override model/data/output paths at runtime.

model:
  name: "protgpt2"
  dtype: "float16"

data:
  fasta_path: "/gpfs/jiaotongdamoxing/zhk_zip/data/uniref50/uniref50.fasta"
  max_seq_len: 256
  num_sequences: 100000

clt:
  # Safer starting point for a single H200. Scale up after validating memory.
  d_clt: 4096
  k: 64
  window: 8
  resample_every: 5000                # Dead feature resampling interval
  dead_feature_threshold: 10000       # Steps without firing before a feature is considered dead

training:
  seed: 0
  gpu: 0
  batch_size: 2
  total_steps: 100000
  lr: 0.0003
  lr_warmup_steps: 2000
  grad_clip_norm: 1.0

checkpoint:
  save_dir: "/oss-pvc/zhk_zip/outputs/research2/clt_weights/protgpt2"
  save_every_steps: 5000

logging:
  wandb_project: null
  wandb_entity: null
  log_every_steps: 50
