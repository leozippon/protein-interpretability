# ZymCTRL CLT v2 retrain — recover deep layers for EC-specific output
# ====================================================================
# Rationale (R2-B in TODO.md):
#   v1 ZymCTRL CLT had L33-35 at 9-17% alive, invalidating our initial
#   claim that L35 dominates EC discrimination. With the same architectural
#   fixes as ProtGPT2 v2 we expect deep-layer alive >= 40%, which restores
#   the reconciled three-phase (L3 → L12 → L30) architecture for steering.
#
# Target quality gates:
#   - deep-layer alive rate (L25-35) >= 40%
#   - at least one usable layer per phase (Recognition / Generation / Output)
#   - EC-specific features emerge at usable layers

model:
  name: "zymctrl"
  dtype: "float16"

data:
  fasta_path: "/gpfs/jiaotongdamoxing/zhk_zip/data/zymctrl/ec_labeled.fasta"
  max_seq_len: 256
  num_sequences: 300000

clt:
  d_clt: 8192
  k: 128
  window: 8
  resample_every: 2500
  dead_feature_threshold: 5000

training:
  seed: 0
  gpu: 0
  batch_size: 2
  total_steps: 200000
  lr: 0.0003
  lr_warmup_steps: 3000
  grad_clip_norm: 1.0

checkpoint:
  save_dir: "/oss-pvc/zhk_zip/outputs/research2/clt_weights/zymctrl_v2"
  save_every_steps: 10000

logging:
  wandb_project: "r2-clt-v2"
  wandb_entity: null
  log_every_steps: 50
