checkpoint:
  save_dir: /oss-pvc/zhk_zip/outputs/research2/clt_weights/protgpt2_v2
  save_every_steps: 10000
clt:
  d_clt: 8192
  dead_feature_threshold: 5000
  dec_norm_weight: 0.01
  init_dec_norm_scale: 0.1
  k: 128
  resample_every: 2500
  window: 8
data:
  fasta_path: /gpfs/jiaotongdamoxing/zhk_zip/data/uniref50/uniref50.fasta
  max_seq_len: 256
  num_sequences: 300000
logging:
  log_every_steps: 50
  wandb_entity: null
  wandb_project: r2-clt-v2
model:
  dtype: float16
  name: protgpt2
training:
  batch_size: 2
  gpu: 0
  grad_clip_norm: 1.0
  lr: 0.0003
  lr_warmup_steps: 3000
  total_steps: 200000
